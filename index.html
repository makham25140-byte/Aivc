<!doctype html>
<html lang="th" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video Director - สตูดิโอผู้กำกับวิดีโอ AI</title>
    <meta name="description" content="ระบบผู้กำกับและออกแบบวิดีโอ AI วางแผนบท แบ่งช็อต ล็อคตัวละคร สร้าง Image/Motion Prompts และแผนตัดต่อครบวงจรฟรี" />
    <meta property="og:title" content="AI Video Director - สตูดิโอผู้กำกับวิดีโอ AI" />
    <meta property="og:description" content="ระบบผู้กำกับและออกแบบวิดีโอ AI วางแผนบท แบ่งช็อต ล็อคตัวละคร สร้าง Image/Motion Prompts และแผนตัดต่อครบวงจรฟรี" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
    <script>
      // Global Anti-Blank-Screen Safety Net
      window.addEventListener('error', function(event) {
        console.error('Global caught error:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.indexOf('data-reactroot') === -1)) {
          var recoveryBox = document.getElementById('aivc-recovery-panel');
          if (recoveryBox) {
            recoveryBox.style.display = 'block';
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); margin-bottom: 20px;">
          <svg style="width: 28px; height: 28px; color: white;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </div>
        <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; letter-spacing: -0.02em;">AIVC Studio - ระบบผู้กำกับวิดีโอ AI</h2>
        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 24px 0; max-width: 380px;">กำลังโหลดระบบสตูดิโอและข้อมูลโปรเจกต์...</p>
        
        <div id="aivc-recovery-panel" style="display: none; background: #0f172a; border: 1px solid #334155; padding: 16px 20px; border-radius: 12px; max-width: 420px; margin-top: 10px;">
          <p style="font-size: 12px; color: #f87171; margin: 0 0 12px 0;">พบข้อขัดข้องในการโหลดข้อมูลจากหน่วยความจำ</p>
          <button onclick="try { localStorage.removeItem('AIVC_PROJECT_BLUEPRINT_V3'); window.location.reload(); } catch(e){ window.location.reload(); }" 
                  style="background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;">
            รีเซ็ตข้อมูลและโหลดใหม่
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
